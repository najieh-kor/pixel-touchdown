<script>
/* PWA (docs/handoff/PWA.md): register the offline service worker sw.js. http(s) only, never file://;
 * skipped on localhost unless the URL has sw=1 (so local edits are never served stale);
 * any failure is ignored so the game always runs. Updates are re-dispatched as a 'pt-sw-updated' event. */
(function () {
  try {
    if (!/^https?:$/.test(location.protocol) || !('serviceWorker' in navigator)) return;
    if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && !/[?&]sw=1\b/.test(location.search)) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
      return;
    }
    navigator.serviceWorker.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.type !== 'pt-sw-updated') return;
      window.PT_SW_UPDATED = d.version;
      try { window.dispatchEvent(new CustomEvent('pt-sw-updated', { detail: d })); } catch (err) { /* old browser */ }
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline mode unavailable */ });
    });
  } catch (e) { /* ignore */ }
})();
</script>
